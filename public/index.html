<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><title>Agent Technology Status</title>
<style>
:root{--navy:#07182b;--panel:#10263f;--text:#f5f8fc;--muted:#a9b8c9;--green:#20c997;--yellow:#ffca2c;--red:#ff5b68}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#061321,#102845);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}main{max-width:1040px;margin:auto;padding:42px 20px}.eyebrow,.updated{color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-size:13px}h1{font-size:clamp(30px,6vw,54px);margin:.15em 0}.overall{display:inline-block;padding:9px 14px;border-radius:999px;font-weight:800;background:#183954}.overall.operational{color:var(--green)}.overall.degraded{color:var(--yellow)}.overall.outage{color:var(--red)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:28px}.card{background:rgba(16,38,63,.94);border:1px solid #294864;border-left:5px solid var(--green);border-radius:16px;padding:20px;box-shadow:0 12px 28px #0004}.card.outage{border-left-color:var(--red)}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.head h2{margin:0;font-size:21px}.badge{font-size:12px;text-transform:uppercase;font-weight:800;color:var(--green)}.outage .badge{color:var(--red)}p{color:var(--muted);line-height:1.5}.reason{color:#ffd2d6;font-weight:700}footer{margin-top:28px;color:var(--muted);font-size:13px}.error{color:var(--red)}
</style></head><body><main><header><div class="eyebrow">Agent Tech Guardian</div><h1>Technology Status</h1><div id="overall" class="overall degraded">Loading</div><p id="checked" class="updated">Fetching independent monitor state…</p></header><section id="systems" class="grid" aria-live="polite"></section><p id="load-error" class="error" hidden></p><footer>Read-only synthetic monitoring · No automatic restarts · Refreshes every 60 seconds</footer></main>
<script>
const endpoint='https://api.github.com/repos/Eden-TDG/agent-tech-guardian/issues/1';
const labels={operational:'Operational',degraded:'Degraded',outage:'Outage'};
function node(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=String(text);return el;}
function render(data){const overall=document.getElementById('overall');overall.className='overall '+data.overall;overall.textContent=labels[data.overall]||data.overall;document.getElementById('checked').textContent='Last checked '+data.checked_at;const grid=document.getElementById('systems');grid.replaceChildren();Object.values(data.systems||{}).forEach(system=>{const card=node('article','card '+system.state);card.dataset.systemState=system.state;const head=node('div','head');head.append(node('h2','',system.display_name),node('span','badge',labels[system.state]||system.state));card.append(head);if(system.stage||system.reason)card.append(node('p','reason',(system.stage||'probe')+': '+(system.reason||'failed')),node('p','',system.diagnostic||''));const success=node('p');success.append(node('strong','', 'Last successful journey'),document.createElement('br'),document.createTextNode(system.last_successful_journey||'Not yet observed'));card.append(success);grid.append(card);});document.getElementById('load-error').hidden=true;}
async function loadStatus(){try{const response=await fetch(endpoint,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});if(!response.ok)throw new Error('status '+response.status);const issue=await response.json();render(JSON.parse(issue.body));}catch(error){const target=document.getElementById('load-error');target.textContent='Status data is temporarily unavailable. Monitor state could not be loaded.';target.hidden=false;}}
loadStatus();setInterval(loadStatus,60000);
</script></body></html>
