name: Guardian Monitor

on:
  schedule:
    # Offset from the busiest top-of-hour GitHub scheduler boundary.
    - cron: "3-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  PYTHONUNBUFFERED: "1"
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: agent-tech-guardian-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore durable monitor state
        run: |
          mkdir -p build
          gh issue view "${{ vars.GUARDIAN_STATE_ISSUE }}" \
            --repo "${{ github.repository }}" --json body --jq .body > build/state.json
          python -m json.tool build/state.json >/dev/null

      - name: Run read-only agent journeys
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
        run: |
          python -m agent_tech_guardian \
            --state-file build/state.json \
            --status-page build/status.html \
            --status-json build/status.json

      - name: Persist incident state
        if: always()
        run: |
          if python -m json.tool build/state.json >/dev/null 2>&1; then
            gh issue edit "${{ vars.GUARDIAN_STATE_ISSUE }}" \
              --repo "${{ github.repository }}" --body-file build/state.json
          fi

      - name: Publish public monitor state
        if: always()
        run: |
          if python -m json.tool build/status.json >/dev/null 2>&1; then
            git config user.name "Agent Tech Guardian"
            git config user.email "guardian@users.noreply.github.com"
            status_blob="$(git hash-object -w build/status.json)"
            state_tree="$(printf '100644 blob %s\tstatus.json\n' "$status_blob" | git mktree)"
            state_commit="$(printf 'Publish Guardian status\n' | git commit-tree "$state_tree")"
            git push --force origin "$state_commit:refs/heads/guardian-state"
          fi

      - name: Publish run summary
        if: always()
        run: |
          if test -f build/status.json; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data=json.load(open('build/status.json'))
          print(f"## Agent Tech Guardian: {data['overall'].title()}")
          print(f"Checked: {data['checked_at']}")
          for row in data['systems'].values():
              print(f"- {row['display_name']}: {row['state']}")
          PY
          fi
